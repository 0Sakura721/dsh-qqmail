# dsh-qqmail —— 把 QQ 邮箱接进 DeepSeek Harness
#
# 本行只做一件事：把 host 插件挂进配置树。工具全部由 index.js 里的 apply()
# 通过 ctx.tools.register 注册，不依赖任何第三方包（零依赖，纯 ESM）。
#
# 授权：
#   默认完全独立 —— 插件自己走 OAuth 扫码授权，令牌只存
#   ~/.dsh/qqmail/credentials.json，不读也不写 ~/.workbuddy/。
#
#   想让插件复用本机 WorkBuddy 已有的授权（省掉首次扫码），在
#   ~/.dsh/qqmail/config.json 里显式打开：
#   {
#     "workbuddyAutoImport": true,
#     "workbuddyReseal": true,
#     "downloadDir": "~/Downloads",
#     "confirmTtlMs": 300000
#   }
#
# 设置页：安装后 DSH 设置里会出现「QQ 邮箱」，可在页面内扫码授权与查看状态。

- insert:
    - id: dsh-qqmail
      name: dsh-qqmail
      inject: [ tools, systemPrompt ]
      config: {}
